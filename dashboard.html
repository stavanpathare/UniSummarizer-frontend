<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard • UniSummarizer</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png" />

  <link rel="stylesheet" href="assets/css/style.css" />
  <script src="assets/js/app.js" defer></script>
</head>
<body class="page-dashboard">

  <div class="wrapper">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="logo-area">
        <img src="assets/img/logo.png" alt="logo" class="sidebar-logo"/>
        <h2>Uni<span>Summarizer</span></h2>
      </div>

      <nav class="nav-links">
        <a href="upload.html" class="active">Upload Notes</a>
        <a href="#">Saved Summaries</a>
        <a href="#">Flashcards</a>
        <a href="#">Quizzes</a>
        <a href="#" class="logout">Logout</a>
      </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content container">

      <!-- TOP BAR -->
      <div class="top-bar">
        <h1>Dashboard</h1>
        <div class="user">
          <img src="assets/img/user.png" alt="user" />
        </div>
      </div>

      <!-- STATS -->
      <div class="stats" id="stats-root"></div>

      <!-- RECENT -->
      <div class="recent">
        <h2>Recent Notes</h2>
        <div class="recent-list" id="recent-list"></div>
      </div>

    </main>
  </div>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const recentList = document.getElementById("recent-list");
  const statsRoot = document.getElementById("stats-root");

  let summaries = getStoredSummaries();

  renderAll();

  /* ================================
     MAIN RENDER FUNCTION
  ================================= */
  function renderAll() {
    summaries = getStoredSummaries();
    renderStats(statsRoot, summaries);
    renderRecentList(recentList, summaries);
  }

  /* ================================
     STORAGE
  ================================= */
  function getStoredSummaries() {
    try {
      return JSON.parse(localStorage.getItem("uniSummaries")) || [];
    } catch (err) {
      console.error("Storage error:", err);
      return [];
    }
  }

  function updateStorage(data) {
    localStorage.setItem("uniSummaries", JSON.stringify(data));
  }

  /* ================================
     RENDER STATS
  ================================= */
  function renderStats(container, summaries) {
    container.innerHTML = `
      <div class="stat-card">
        <h3>${summaries.length}</h3>
        <p>Total Summaries</p>
      </div>
    `;
  }

  /* ================================
     RENDER RECENT LIST
  ================================= */
  function renderRecentList(container, summaries) {
    container.innerHTML = "";

    if (summaries.length === 0) {
      container.innerHTML = "<p>No saved summaries yet.</p>";
      return;
    }

    [...summaries].reverse().forEach(item => {
      const div = document.createElement("div");
      div.className = "recent-item";

      div.innerHTML = `
        <div>
          <strong>${item.title}</strong>
          <p class="muted">${item.createdAt}</p>
        </div>

        <div class="recent-actions">
          <button class="view-btn">View</button>
          <button class="delete-btn">Delete</button>
        </div>
      `;

      // VIEW
      div.querySelector(".view-btn").addEventListener("click", () => {
        openSummaryModal(item);
      });

      // DELETE
      div.querySelector(".delete-btn").addEventListener("click", () => {
        deleteSummary(item.id);
      });

      container.appendChild(div);
    });
  }

  /* ================================
     DELETE SUMMARY
  ================================= */
  function deleteSummary(id) {
    const confirmDelete = confirm("Are you sure you want to delete this summary?");
    if (!confirmDelete) return;

    const updated = summaries.filter(item => item.id !== id);
    updateStorage(updated);

    renderAll(); // re-render without reload
  }

  /* ================================
     MODAL VIEW
  ================================= */
  function openSummaryModal(data) {
    const modal = document.createElement("div");
    modal.className = "summary-modal";

    modal.innerHTML = `
      <div class="summary-modal-content">
        <h2>${data.title}</h2>
        <p class="muted">${data.createdAt}</p>

        <h3>Summary</h3>
        <p>${data.summary}</p>

        <h3>Key Points</h3>
        <ul>
          ${(data.keyPoints || [])
            .map(point => `<li>${point}</li>`)
            .join("")}
        </ul>

        <h3>Flashcards</h3>
        <div class="modal-flashcards">
          ${(data.flashcards || [])
            .map(card => `
              <div class="modal-flashcard">
                <strong>Q:</strong> ${card.question}<br>
              </div>
            `)
            .join("")}
        </div>

        <button class="btn close-btn">Close</button>
      </div>
    `;

    modal.querySelector(".close-btn").addEventListener("click", () => {
      modal.remove();
    });

    modal.addEventListener("click", (e) => {
      if (e.target === modal) {
        modal.remove();
      }
    });

    document.body.appendChild(modal);
  }
});
</script>
</body>
</html>
