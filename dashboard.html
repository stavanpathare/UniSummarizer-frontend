<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard • UniSummarizer</title>
  <link rel="icon" type="image/png" href="assets/img/dashboard.png" />

  <link rel="stylesheet" href="assets/css/style.css" />
  <script src="assets/js/api.js" defer></script>
  <script src="assets/js/app.js" defer></script>
</head>
<body class="page-dashboard">

  <div class="wrapper">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="logo-area">
        <a href="index.html"><img src="assets/img/logo.png" alt="logo" class="sidebar-logo"/></a>
        <h2>Uni<span>Summarizer</span></h2>
      </div>

      <nav class="nav-links">
        <a href="upload.html" class="active">Upload Notes</a>
        <a href="dashboard.html">Saved Summaries</a>
        <a href="flashcards.html">Flashcards</a>
        <a href="mcqs.html">Quizzes</a>

    <!-- MAIN CONTENT -->
    <main class="main-content container">

      <div class="top-bar">
        <h1>Dashboard</h1>
        <div class="user">
          <img src="assets/img/user.png" alt="user" />
        </div>
      </div>

      <!-- STATS -->
      <div class="stats" id="stats-root"></div>

      <!-- RECENT -->
      <div class="recent">
        <h2>Recent Notes</h2>
        <div class="recent-list" id="recent-list"></div>

      <!-- FOOTER -->
        <footer class="footer container">
              <p>© 2025 Created by <a href="http://stavanlabs.is-a.dev" class="stavan-labs">Stavan Labs</a>. All rights reserved.</p>
