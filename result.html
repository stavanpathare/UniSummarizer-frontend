<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Results • UniSummarizer</title>
  <link rel="icon" type="image/png" href="assets/img/output.png" />

  <link rel="stylesheet" href="assets/css/style.css" />
  <script src="assets/js/api.js" defer></script>
  <script src="assets/js/app.js" defer></script>
</head>
<body class="page-result">

  <!-- HEADER -->
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <img src="assets/img/logo.png" alt="logo" />
        <span>UniSummarizer</span>
      </a>

      <nav class="nav">
        <a href="upload.html" class="nav-link">Upload</a>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
      </nav>
    </div>
  </header>

  <!-- ✅ CENTERED RESULT PAGE -->
  <main class="result-page">
    <div class="result-card">

      <!-- SUMMARY -->
      <div class="result-box">
        <h2>Summary</h2>
        <p id="summary-output">Generated summary will appear here...</p>
      </div>

      <!-- KEY POINTS -->
      <div class="result-box">
        <h2>Key Points</h2>
        <ul id="key-points"></ul>
      </div>

      <div class="result-box">
  <h2>Flashcards</h2>
  <div id="flashcards" class="flashcards" aria-live="polite"></div>
</div>

      <!-- MCQ -->
      <div class="result-box">
        <h2>MCQ Questions</h2>
        <div id="mcq-list"></div>
      </div>

      <!-- ACTIONS -->
      <div class="actions-row">
        <div class="download-actions">
  <button id="downloadTxt" class="btn">Download TXT</button>
  <button id="downloadPdf" class="btn">Download PDF</button>
</div>
        <button id="save-btn" class="btn btn-outline">Save to Dashboard</button>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer container">
    <p>© 2025 Created by Stavan Labs. All rights reserved.</p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
  function getSummaryAndKeyPoints() {
    const summaryEl = document.getElementById("summary-output");
    const keyPointsEls = document.querySelectorAll("#key-points li");

    const summary = summaryEl?.innerText.trim() || "";

    const keyPoints = Array.from(keyPointsEls)
      .map((li, i) => `${i + 1}. ${li.innerText.trim()}`)
      .join("\n");

    if (!summary && keyPointsEls.length === 0) return null;

    return {
      summary,
      keyPoints,
      combinedText: `SUMMARY\n\n${summary}\n\nKEY POINTS\n\n${keyPoints}`
    };
  }

  /* -------- TXT DOWNLOAD -------- */
  document.getElementById("downloadTxt").addEventListener("click", () => {
    const data = getSummaryAndKeyPoints();
    if (!data) return alert("Nothing to download");

    const blob = new Blob([data.combinedText], {
      type: "text/plain;charset=utf-8"
    });

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "UniSummarizer_Summary.txt";
    a.click();
    URL.revokeObjectURL(url);
  });

  /* -------- PDF DOWNLOAD -------- */
  document.getElementById("downloadPdf").addEventListener("click", () => {
    const data = getSummaryAndKeyPoints();
    if (!data) return alert("Nothing to download");

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF();

    pdf.setFontSize(16);
    pdf.text("SUMMARY", 14, 20);

    pdf.setFontSize(12);
    pdf.text(pdf.splitTextToSize(data.summary, 180), 14, 30);

    let y = pdf.lastAutoTable?.finalY || 60;

    pdf.setFontSize(16);
    pdf.text("KEY POINTS", 14, y);

    pdf.setFontSize(12);
    pdf.text(
      pdf.splitTextToSize(data.keyPoints, 180),
      14,
      y + 10
    );

    pdf.save("UniSummarizer_Summary.pdf");
  });
  /* ===========================
   Save Btn
=========================== */
document.getElementById("save-btn").addEventListener("click", () => {
  // Save to backend using API utility (requires auth)
  const token = localStorage.getItem("authToken");
  if (!token) {
    showToast("Please login to save summaries", true);
    window.location.href = "login.html";
    return;
  }

  const summary = document.getElementById("summary-output").innerText || "";
  const keyPoints = Array.from(document.querySelectorAll("#key-points li")).map(li => li.innerText);
  const flashcards = Array.from(document.querySelectorAll(".flashcard")).map(card => ({
    question: card.querySelector('.flashcard-front')?.innerText || card.innerText,
    answer: card.querySelector('.flashcard-back')?.innerText || ""
  }));

  const mcqs = Array.from(document.querySelectorAll('.mcq')).map(block => {
    const question = block.querySelector('h4')?.innerText || '';
    const optionEls = Array.from(block.querySelectorAll('.mcq-option'));
    const options = optionEls.map(o => o.innerText);
    const answerIndex = optionEls.findIndex(o => {
      const inline = (o.style && o.style.background) || '';
      const computed = getComputedStyle ? getComputedStyle(o).backgroundColor : '';
      return inline === '#86efac' || inline === '#86efac' || computed === 'rgb(134, 239, 172)';
    });
    return { question, options, answerIndex: answerIndex >= 0 ? answerIndex : 0 };
  });

  if (!summary.trim()) {
    showToast('No summary to save', true);
    return;
  }

  const payload = {
    title: 'Generated Summary',
    summary,
    keyPoints,
    flashcards,
    mcqs
  };

  showLoader(true);
  window.api.saveSummary(payload)
    .then(() => {
      showToast('Saved to Dashboard');
    })
    .catch(err => {
      showToast(err.message || 'Save failed', true);
    })
    .finally(() => showLoader(false));
});
</script>

</body>
</html>
